name: Build PS3 pkg

on:
  workflow_dispatch:
  push:
    paths:
      - 'katana-zero-ps3.zip'
      - '.github/workflows/build-ps3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
      PORTLIBS: /usr/local/ps3dev/portlibs/ppu
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pacotes
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc g++ libelf-dev make texinfo \
            libncurses5-dev patch python3 python3-dev python-is-python3 wget \
            zlib1g-dev libtool-bin bzip2 libgmp3-dev pkg-config libssl-dev git zip unzip
          sudo mkdir -p "$PS3DEV"
          sudo chown -R "$(id -u):$(id -g)" "$PS3DEV"
          {
            echo "$PS3DEV/bin"
            echo "$PS3DEV/ppu/bin"
            echo "$PS3DEV/spu/bin"
          } >> "$GITHUB_PATH"

      # Cache do ambiente (compilador + PSL1GHT + SDL2). Depois da 1a vez vem daqui.
      - name: Restaurar cache do ambiente PS3
        id: env
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-sdl2-env-v1

      - name: Baixar compilador pronto (ps3toolchain nightly)
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          TAG=$(gh release list --repo ps3dev/ps3toolchain --limit 1 --json tagName -q '.[0].tagName')
          echo "Usando $TAG"
          gh release download "$TAG" --repo ps3dev/ps3toolchain \
            --pattern 'ps3dev-linux-X64.tar.gz' --dir /tmp
          sudo tar -xzf /tmp/ps3dev-linux-X64.tar.gz -C /usr/local
          sudo chown -R "$(id -u):$(id -g)" "$PS3DEV"

      - name: Compilar PSL1GHT (SDK)
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/clienthax/psl1ght.git /tmp/psl1ght
          cd /tmp/psl1ght
          git submodule update --init --depth 1 || true
          make install-ctrl && make && make install

      - name: Compilar SDL2 para PS3
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b sdl2_master https://github.com/shagkur/SDL_PSL1GHT.git /tmp/sdl2p
          cd /tmp/sdl2p
          ./script.sh
          make -j"$(nproc)"
          make install

      - name: Salvar cache do ambiente PS3
        if: steps.env.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-sdl2-env-v1

      - name: Conferir ambiente
        run: |
          ls "$PS3DEV/ppu/bin" | head -5
          "$PORTLIBS/bin/sdl2-config" --version

      - name: Compilar o jogo
        run: |
          unzip -q -o katana-zero-ps3.zip
          cd katana-zero-ps3
          make -f Makefile.ps3 clean
          make -f Makefile.ps3 katana.pkg
          ls -la *.pkg

      - name: Guardar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: katana-zero-ps3
          path: |
            katana-zero-ps3/*.pkg
            katana-zero-ps3/katana.elf

      - name: Publicar Release (baixe o .pkg por aqui)
        run: |
          gh release create "katana-ps3-${{ github.run_number }}" katana-zero-ps3/*.pkg \
            --title "Katana ZERO PS3 build ${{ github.run_number }}" \
            --notes "katana.pkg = instalador normal (CFW/HEN). katana.gnpdrm.pkg = versao finalizada, use se o primeiro nao instalar. Nao testado em hardware."
            
